services:
  - type: web
    name: velora-store
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: velora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: velora-db
    plan: free
